version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: amazona_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "radiadores_amazona_db"
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
    name: amazona_pg_data